# ===================================================================
# Insurance Portal - Application Configuration
# ===================================================================

# --- Server ---
server.port=8080

# --- Database (H2, FILE mode - persists to ./data/hackathondb.mv.db) ---
# IMPORTANT: without "file:", H2 defaults to in-memory and all data is
# lost every time the app restarts. This config is deliberately file-based
# so demo data survives restarts during the hackathon.
spring.datasource.url=jdbc:h2:file:./data/hackathondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update: creates/updates tables automatically from the entity classes,
# without wiping existing data on restart (unlike create-drop).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console (view/query the DB in a browser during the demo) ---
# Visit http://localhost:8080/h2-console while the app is running.
# JDBC URL to paste in: jdbc:h2:file:./data/hackathondb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
# Cache disabled so template edits show up on refresh without a restart.
spring.thymeleaf.cache=false

# --- Application-specific: where structured logs get written ---
# This is the file the downstream monitoring app reads/tails.
app.log-file-path=logs/app.log
