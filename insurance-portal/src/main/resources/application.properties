# ===================================================================
# Insurance Portal - Application Configuration
# ===================================================================

# --- Server ---
server.port=8080

# --- Database (Supabase / PostgreSQL) ---
# Connect the app to YOUR OWN Supabase project. Nothing here is committed with
# real values - copy .env.example to .env and fill in your own connection
# details. The line below auto-loads that .env file on startup (optional: it's
# skipped if the file is missing), so you never have to export shell variables.
#
# Where to get the values (Supabase Dashboard -> your project -> Project
# Settings -> Database -> "Connection string" -> JDBC tab). Use the connection
# pooler (Supavisor) host - it works over IPv4; the direct db.<ref>.supabase.co
# host is IPv6-only and times out on many networks. Pooler username format is
# "postgres.<your-project-ref>".
#
# These are intentionally required (no defaults) so the app never silently
# connects to someone else's database - if a value is missing, startup fails
# fast telling you which one.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# --- JPA / Hibernate ---
# update: reconciles the schema with the entity classes on startup without
# wiping existing data. On a brand-new/empty Supabase project this creates all
# the tables automatically, so a fresh clone just works - DataSeeder then adds
# the demo accounts on first run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Cache disabled so template edits show up on refresh without a restart.
spring.thymeleaf.cache=false

# --- Application-specific: where structured logs get written ---
# This is the file the downstream monitoring app reads/tails.
app.log-file-path=logs/app.log

# ===================================================================
# Error-alerting: scan the log for error events and email a report
# ===================================================================
# A scheduled scan (every scan-interval-ms) plus an on-demand trigger
# (POST /internal/alerts/scan) read the log file, pick out error events, group
# them by service (application_name), and email an HTML report via Resend. Only
# NEW lines since the previous scan are reported, so you don't get duplicate mail.
#
# ONLY the infrastructure error types listed in alerting.error-types below
# trigger mail. Expected business failures are logged as WARNING (invalid login,
# declined payment, claim-not-found, empty customer search) and are ignored.
alerting.enabled=true
alerting.log-file-path=${app.log-file-path}
# 300000 ms = 5 minutes between scans (keeps mail volume to ~1 report per 5 min).
alerting.scan-interval-ms=300000
# How long after startup the first scan runs. 30000 ms = 30 seconds.
alerting.initial-delay-ms=30000
alerting.skip-email-when-no-errors=true
# Warning-alert rule: business failures logged as WARNING are counted per date;
# when a date's running count reaches this many, a styled Warning Report email
# is sent (same format as the error report) and that batch is cleared. Set to 11
# for strictly "more than 10".
alerting.warning-threshold=10

# Resend. The API key is a secret - keep it in .env (RESEND_API_KEY), never here.
alerting.resend-api-key=${RESEND_API_KEY:}
alerting.resend-url=https://api.resend.com/emails
# Test sender needs no domain setup, but Resend will only DELIVER to your own
# Resend account email while you use it. Verify a domain to send anywhere else.
alerting.mail-from=${ALERT_MAIL_FROM:onboarding@resend.dev}
# Comma-separated list of recipients.
alerting.mail-to=${ALERT_MAIL_TO:}

# The ONLY error types that trigger an alert email. A log line matches when its
# "error" or "event_type" equals (case-insensitive) one of these.
alerting.error-types=Claim Service Timeout,Payment Gateway Unavailable,Gateway Timeout,Database Connection Failure,Cache Server Unavailable,Connection Pool Exhausted

# --- Hackathon fault simulator ---
# Periodically writes one of the error-types above into the log so the scan+mail
# cycle has real infrastructure errors to report. Runs ONLY while the app is up
# (it's a scheduled in-app task); nothing is written when the app is stopped.
# Set enabled=false for a clean demo. 300000 ms = one injected fault every 5 min.
alerting.fault-injection-enabled=true
alerting.fault-injection-interval-ms=300000
