# ===================================================================
# Insurance Portal - Application Configuration
# ===================================================================

# --- Server ---
server.port=8080

# --- Database (Supabase / PostgreSQL) ---
# Credentials are read from environment variables so they are never committed
# to source control. See .env.example for the variables to set, and grab the
# exact connection string + password from:
#   Supabase Dashboard -> Project Settings -> Database -> Connection string (JDBC)
#
# The default URL uses the Supabase connection pooler (Supavisor) in session
# mode, which is reachable over IPv4 - the direct db.<ref>.supabase.co host is
# IPv6-only and times out on many networks. Note the pooler username format:
# "postgres.<project-ref>". Override SUPABASE_DB_URL/USER for a direct connection.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres.rmpucaqbvbedwagtynrt}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# --- JPA / Hibernate ---
# update: reconciles the schema with the entity classes on startup without
# wiping existing data. The tables were pre-created in Supabase to match.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Cache disabled so template edits show up on refresh without a restart.
spring.thymeleaf.cache=false

# --- Application-specific: where structured logs get written ---
# This is the file the downstream monitoring app reads/tails.
app.log-file-path=logs/app.log
