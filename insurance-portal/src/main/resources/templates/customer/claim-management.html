<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Claim Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar customer">
    <span class="brand">Insurance Portal - Customer</span>
    <span class="links">
        <a th:href="@{/customer/home}">Home</a>
        <a th:href="@{/customer/logout}">Log out</a>
    </span>
</div>

<div class="container">
    <h2>Claim Management</h2>

    <div class="card">
        <h3>Your claims</h3>
        <table th:if="${not #lists.isEmpty(claims)}">
            <thead>
            <tr><th>Claim ID</th><th>Type</th><th>Amount</th><th>Status</th><th>Decision</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${claims}">
                <td th:text="${c.claimId}"></td>
                <td th:text="${c.claimType}"></td>
                <td th:text="${c.claimAmount}"></td>
                <td><span class="badge badge-info" th:text="${c.claimStatus}"></span></td>
                <td th:text="${c.claimDecision}"></td>
            </tr>
            </tbody>
        </table>
        <p class="muted" th:if="${#lists.isEmpty(claims)}">No claims filed yet.</p>
    </div>

    <div class="card">
        <h3>Raise a claim</h3>
        <form th:action="@{/customer/claims/submit}" method="post">
            <label for="policyId">Policy</label>
            <select id="policyId" name="policyId">
                <option th:each="p : ${policies}" th:value="${p.policyId}"
                        th:text="${p.policyId + ' - ' + p.policyType}"></option>
            </select>

            <label for="claimType">Claim type</label>
            <input type="text" id="claimType" name="claimType" placeholder="e.g. Hospitalization" required>

            <label for="claimAmount">Claim amount</label>
            <input type="number" id="claimAmount" name="claimAmount" step="0.01" min="1" required>

            <button type="submit" class="btn btn-customer" style="margin-top: 14px;">Submit claim</button>
        </form>
    </div>

    <div class="card">
        <h3>Track a claim</h3>

        <div class="alert alert-error" th:if="${trackError}" th:text="${trackError}"></div>
        <div class="alert alert-success" th:if="${trackedClaim}">
            Claim <span th:text="${trackedClaim.claimId}"></span> status:
            <strong th:text="${trackedClaim.claimStatus}"></strong>
            (decision: <span th:text="${trackedClaim.claimDecision}"></span>)
        </div>

        <form th:action="@{/customer/claims/track}" method="post">
            <label for="claimId">Claim ID</label>
            <input type="text" id="claimId" name="claimId" placeholder="e.g. CLM-2026-000101" required>
            <button type="submit" class="btn btn-secondary" style="margin-top: 14px;">Track status</button>
        </form>
    </div>
</div>
</body>
</html>
