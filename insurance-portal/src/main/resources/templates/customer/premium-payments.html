<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Premium Payments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar customer">
    <span class="brand">Insurance Portal - Customer</span>
    <span class="links">
        <a th:href="@{/customer/home}">Home</a>
        <a th:href="@{/customer/logout}">Log out</a>
    </span>
</div>

<div class="container">
    <h2>Premium Payments</h2>

    <div class="alert alert-success" th:if="${paymentSuccess}">Payment successful.</div>
    <div class="alert alert-error" th:if="${paymentError}" th:text="${paymentError}"></div>

    <div class="card">
        <h3>Pay a premium</h3>
        <form th:action="@{/customer/payments/pay}" method="post">
            <label for="policyId">Policy</label>
            <select id="policyId" name="policyId">
                <option th:each="p : ${policies}" th:value="${p.policyId}"
                        th:text="${p.policyId + ' - ' + p.policyType + ' - ' + p.premiumAmount}"></option>
            </select>

            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="1" value="5000" required>

            <label for="paymentMethod">Payment method</label>
            <select id="paymentMethod" name="paymentMethod">
                <option value="CREDIT_CARD">Credit card</option>
                <option value="NET_BANKING">Net banking</option>
                <option value="WALLET">Wallet</option>
            </select>

            <button type="submit" class="btn btn-customer" style="margin-top: 14px;">Pay now</button>
        </form>
        <p class="small-note">This uses a simulated payment gateway - roughly 1 in 8 attempts is randomly declined so you can demo the failure log path too.</p>
    </div>

    <div class="card">
        <h3>Payment history</h3>
        <table th:if="${not #lists.isEmpty(payments)}">
            <thead>
            <tr><th>Payment ID</th><th>Amount</th><th>Method</th><th>Gateway</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="pay : ${payments}">
                <td th:text="${pay.paymentId}"></td>
                <td th:text="${pay.amount}"></td>
                <td th:text="${pay.paymentMethod}"></td>
                <td th:text="${pay.gateway}"></td>
                <td>
                    <span th:if="${pay.status == 'SUCCESS'}" class="badge badge-success" th:text="${pay.status}"></span>
                    <span th:if="${pay.status == 'FAILED'}" class="badge badge-failed" th:text="${pay.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="muted" th:if="${#lists.isEmpty(payments)}">No payments yet.</p>
    </div>
</div>
</body>
</html>
