<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agent Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 60px;">
    <div class="card">
        <h2>Agent login</h2>

        <div class="alert alert-success" th:if="${param.registered}">
            Agent account created. You can log in now.
        </div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/agent/login}" method="post">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-agent" style="margin-top: 18px; width: 100%;">Log in</button>
        </form>

        <p class="muted" style="margin-top: 16px;">
            New agent? <a th:href="@{/agent/register}">Create an account</a>
        </p>
        <p class="small-note">
            Demo account: agent@company.com / agent123
        </p>
        <p><a th:href="@{/}" class="muted">&larr; Back to home</a></p>
    </div>
</div>
</body>
</html>
