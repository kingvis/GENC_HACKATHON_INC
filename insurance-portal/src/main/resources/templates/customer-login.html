<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 60px;">
    <div class="card">
        <h2>Customer login</h2>

        <div class="alert alert-success" th:if="${param.registered}">
            Account created. You can log in now.
        </div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/customer/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-customer" style="margin-top: 18px; width: 100%;">Log in</button>
        </form>

        <p class="muted" style="margin-top: 16px;">
            New here? <a th:href="@{/customer/register}">Create an account</a>
        </p>
        <p class="small-note">
            Demo account: jane.doe / password123 (has an existing policy and claim)
        </p>
        <p><a th:href="@{/}" class="muted">&larr; Back to home</a></p>
    </div>
</div>
</body>
</html>
