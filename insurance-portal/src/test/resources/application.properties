# ===================================================================
# TEST-only configuration.
# ===================================================================
# The smoke test (InsurancePortalApplicationTests) boots the whole Spring
# context, which needs a database. Tests must NOT depend on a real Supabase
# connection or on a .env file - otherwise `mvn test` / `mvn package` would
# fail for anyone who just cloned the repo. So tests run against an in-memory
# H2 database (already a test-scope dependency) instead.
#
# These override the main application.properties values, so no SUPABASE_DB_*
# environment variables or .env file are required to build and test.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Write test log lines to a throwaway location, not the real logs/app.log.
app.log-file-path=target/test-app.log
